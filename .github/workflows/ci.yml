name: GHOST v2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cloud API dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Windows agent dependencies
        run: python -m pip install -r local_agent/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q api local_agent tests
      - name: Run cloud API contract tests
        run: python -m unittest discover -s tests -v
      - name: Run local agent tests
        working-directory: local_agent
        run: python -m unittest -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Build Next.js application
        run: npm run build
